---
# Tailscale-tuned EnvoyProxy: provisions the Service with
# `loadBalancerClass: tailscale` so the tailscale operator handles LB IP
# allocation onto the tailnet. Combined with the `tailscale.com/proxy-group`
# annotation on the Gateway, traffic rides the existing ingress-proxy
# ProxyGroup instead of spawning new tailscale pods.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-tailscale
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          image: mirror.gcr.io/envoyproxy/envoy:v1.39.1
          # imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 50m
              memory: 212Mi
            limits:
              memory: 1Gi
      envoyService:
        externalTrafficPolicy: Local
        loadBalancerClass: tailscale
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-tailscale
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: Envoy GatewayClass with a Tailscale-classed LoadBalancer Service
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-tailscale
    namespace: network

---
# Tailscale-only gateway. Uses the envoy-tailscale GatewayClass which
# provisions the LB Service with `loadBalancerClass: tailscale`, so the
# tailscale operator handles LB IP allocation. The `proxy-group`
# annotation routes through the existing ingress-proxy ProxyGroup so we
# don't spawn dedicated tailscale-running pods.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-tailscale
  annotations:
    external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy-tailscale
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: internal.${SECRET_DOMAIN}
      tailscale.com/hostname: ts-envoy-gw
      tailscale.com/proxy-group: ingress-proxy
    labels: {}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls



